name: Test

on: pull_request

jobs:
  lint:
    if: github.ref != 'refs/heads/renovate/*'
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/hadolint@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true

  php8_2:
    runs-on: dind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get docker tags
        id: tags
        shell: sh
        env:
          VERSION_TYPE: "docker_env"
          APP_ENV: "php8.2"
          APP_NAME: "COMPOSER"
          DOCKERFILE_PATH: "php8.2/Dockerfile"
          IMAGE_NAME: "git.walbeck.it/mwalbeck/composer"
        run: |
          determine-docker-tags
          dockerd &
      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test build
        uses: actions/docker-build-push@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.tags.outputs.tags }}
          context: ./php8.2

  php8_3:
    runs-on: dind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get docker tags
        id: tags
        shell: sh
        env:
          VERSION_TYPE: "docker_env"
          APP_ENV: "php8.3"
          APP_NAME: "COMPOSER"
          DOCKERFILE_PATH: "php8.3/Dockerfile"
          IMAGE_NAME: "git.walbeck.it/mwalbeck/composer"
        run: |
          determine-docker-tags
          dockerd &
      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test build
        uses: actions/docker-build-push@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.tags.outputs.tags }}
          context: ./php8.3

  php8_4:
    runs-on: dind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get docker tags
        id: tags
        shell: sh
        env:
          VERSION_TYPE: "docker_env"
          APP_ENV: "php8.4"
          APP_NAME: "COMPOSER"
          DOCKERFILE_PATH: "php8.4/Dockerfile"
          IMAGE_NAME: "git.walbeck.it/mwalbeck/composer"
        run: |
          determine-docker-tags
          dockerd &
      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test build
        uses: actions/docker-build-push@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.tags.outputs.tags }}
          context: ./php8.4

  php8_5:
    runs-on: dind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get docker tags
        id: tags
        shell: sh
        env:
          VERSION_TYPE: "docker_env"
          APP_ENV: "php8.5"
          APP_NAME: "COMPOSER"
          DOCKERFILE_PATH: "php8.5/Dockerfile"
          IMAGE_NAME: "git.walbeck.it/mwalbeck/composer"
        run: |
          determine-docker-tags
          dockerd &
      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test build
        uses: actions/docker-build-push@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.tags.outputs.tags }}
          context: ./php8.5
